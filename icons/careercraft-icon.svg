<!-- CareerCraft AI Icon - Main Version -->
<!-- Represents: Craft tools building a career path with AI elements -->
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle - LinkedIn Blue gradient -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)"/>
  
  <!-- Briefcase (Career) -->
  <path d="M35 50 H93 V90 C93 93 90 96 87 96 H41 C38 96 35 93 35 90 Z" fill="#ffffff" opacity="0.9"/>
  <rect x="52" y="42" width="24" height="8" rx="2" fill="#ffffff" opacity="0.9"/>
  <line x1="35" y1="62" x2="93" y2="62" stroke="#0a66c2" stroke-width="3"/>
  
  <!-- Hammer (Craft) - diagonal across briefcase -->
  <g transform="rotate(-45 64 64)">
    <rect x="58" y="25" width="12" height="35" rx="2" fill="#FFA500"/>
    <rect x="52" y="20" width="24" height="12" rx="3" fill="#FF8C00"/>
  </g>
  
  <!-- AI Sparkles/Nodes -->
  <circle cx="45" cy="38" r="3" fill="#FFD700"/>
  <circle cx="83" cy="38" r="3" fill="#FFD700"/>
  <circle cx="98" cy="70" r="3" fill="#FFD700"/>
  <circle cx="30" cy="70" r="3" fill="#FFD700"/>
  
  <!-- Neural network lines (subtle AI representation) -->
  <line x1="45" y1="38" x2="64" y2="50" stroke="#FFD700" stroke-width="1.5" opacity="0.5"/>
  <line x1="83" y1="38" x2="64" y2="50" stroke="#FFD700" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a66c2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004182;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
