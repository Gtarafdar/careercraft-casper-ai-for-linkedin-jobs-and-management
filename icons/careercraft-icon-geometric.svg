<!-- CareerCraft AI Icon - Geometric/Modern Version -->
<!-- Angular, tech-forward design -->
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="64" cy="64" r="60" fill="url(#grad2)"/>
  
  <!-- Geometric briefcase/ladder shape (career progression) -->
  <path d="M40 85 L40 55 L50 45 L78 45 L88 55 L88 85 Z" fill="#ffffff" opacity="0.2"/>
  <path d="M40 55 L88 55 L88 85 L40 85 Z" fill="#ffffff" opacity="0.9"/>
  
  <!-- Steps/Ladder (career growth) -->
  <line x1="50" y1="65" x2="78" y2="65" stroke="#0a66c2" stroke-width="3"/>
  <line x1="50" y1="75" x2="78" y2="75" stroke="#0a66c2" stroke-width="3"/>
  
  <!-- Hammer handle diagonal -->
  <rect x="52" y="28" width="8" height="32" rx="2" fill="#FFA500" transform="rotate(-25 56 44)"/>
  
  <!-- Hammer head -->
  <rect x="45" y="20" width="20" height="10" rx="2" fill="#FF8C00" transform="rotate(-25 55 25)"/>
  
  <!-- AI Neural nodes corner accents -->
  <circle cx="30" cy="30" r="4" fill="#FFD700"/>
  <circle cx="98" cy="30" r="4" fill="#FFD700"/>
  <circle cx="30" cy="98" r="4" fill="#FFD700"/>
  <circle cx="98" cy="98" r="4" fill="#FFD700"/>
  
  <!-- Connecting lines (neural network) -->
  <line x1="30" y1="30" x2="64" y2="45" stroke="#FFD700" stroke-width="1.5" opacity="0.4"/>
  <line x1="98" y1="30" x2="64" y2="45" stroke="#FFD700" stroke-width="1.5" opacity="0.4"/>
  
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a66c2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004182;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
