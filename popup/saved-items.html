<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved Content - LinkedIn Helper</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      /* Header */
      .header {
        background: white;
        border-radius: 12px;
        padding: 24px 32px;
        margin-bottom: 24px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .header h1 {
        font-size: 28px;
        color: #1a202c;
        font-weight: 700;
      }

      .header-actions {
        display: flex;
        gap: 12px;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #0a66c2 0%, #004182 100%);
        color: white;
        box-shadow: 0 2px 8px rgba(10, 102, 194, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(10, 102, 194, 0.4);
      }

      .btn-secondary {
        background: white;
        color: #0a66c2;
        border: 2px solid #0a66c2;
      }

      .btn-secondary:hover {
        background: #f3f6f9;
      }

      /* Stats Bar */
      .stats-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }

      .stat-card {
        background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
        padding: 16px;
        border-radius: 10px;
        border: 2px solid #e5e7eb;
        text-align: center;
      }

      .stat-card.active {
        border-color: #0a66c2;
        background: linear-gradient(135deg, #e8f4f8 0%, #d1e7f0 100%);
      }

      .stat-number {
        font-size: 32px;
        font-weight: 800;
        color: #0a66c2;
        line-height: 1;
        margin-bottom: 6px;
      }

      .stat-label {
        font-size: 13px;
        color: #64748b;
        font-weight: 600;
        text-transform: uppercase;
      }

      /* Search & Filter Bar */
      .controls {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .search-box {
        flex: 1;
        min-width: 250px;
      }

      .search-box input {
        width: 100%;
        padding: 12px 16px 12px 44px;
        border: 2px solid #d1d5db;
        border-radius: 10px;
        font-size: 15px;
        background: white
          url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%23999" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>')
          no-repeat 14px center;
      }

      .search-box input:focus {
        outline: none;
        border-color: #0a66c2;
      }

      .sort-select {
        padding: 12px 16px;
        border: 2px solid #d1d5db;
        border-radius: 10px;
        font-size: 14px;
        background: white;
        cursor: pointer;
        font-weight: 600;
        color: #374151;
      }

      .sort-select:focus {
        outline: none;
        border-color: #0a66c2;
      }

      /* Category Tabs */
      .category-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .category-tab {
        padding: 12px 24px;
        border: 2px solid #e5e7eb;
        background: white;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        color: #64748b;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .category-tab:hover {
        border-color: #0a66c2;
        color: #0a66c2;
      }

      .category-tab.active {
        background: linear-gradient(135deg, #0a66c2 0%, #004182 100%);
        color: white;
        border-color: #0a66c2;
        box-shadow: 0 2px 8px rgba(10, 102, 194, 0.3);
      }

      .category-count {
        background: rgba(255, 255, 255, 0.2);
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 700;
      }

      /* Content Grid */
      .content-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
        margin-bottom: 24px;
      }

      .content-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid #e5e7eb;
        transition: all 0.3s;
        cursor: pointer;
        position: relative;
      }

      .content-card:hover {
        border-color: #0a66c2;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        transform: translateY(-4px);
      }

      .content-card.selected {
        border-color: #0a66c2;
        box-shadow: 0 0 0 3px rgba(10, 102, 194, 0.2);
      }

      .card-thumbnail {
        width: 100%;
        height: 180px;
        background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .card-thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-thumbnail .placeholder {
        font-size: 48px;
        opacity: 0.3;
      }

      .card-content {
        padding: 16px;
      }

      .card-type {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .type-post {
        background: #e0f2fe;
        color: #0369a1;
      }

      .type-link {
        background: #fef3c7;
        color: #92400e;
      }

      .type-visual {
        background: #d1fae5;
        color: #065f46;
      }

      .type-video {
        background: #fce7f3;
        color: #9f1239;
      }

      .card-title {
        font-size: 15px;
        font-weight: 600;
        color: #1a202c;
        margin-bottom: 8px;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .card-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #f3f4f6;
      }

      .card-author {
        font-size: 13px;
        color: #64748b;
        font-weight: 500;
      }

      .card-date {
        font-size: 12px;
        color: #94a3b8;
      }

      .card-actions {
        position: absolute;
        top: 12px;
        right: 12px;
        display: none;
        gap: 8px;
      }

      .content-card:hover .card-actions {
        display: flex;
      }

      .action-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: white;
        border: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .action-btn:hover {
        background: #0a66c2;
        color: white;
        transform: scale(1.1);
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 80px 20px;
        background: white;
        border-radius: 12px;
        border: 2px dashed #d1d5db;
      }

      .empty-state-icon {
        font-size: 64px;
        margin-bottom: 16px;
        opacity: 0.3;
      }

      .empty-state h3 {
        font-size: 20px;
        color: #1a202c;
        margin-bottom: 8px;
      }

      .empty-state p {
        color: #64748b;
        font-size: 14px;
      }

      /* Loading Spinner */
      .loading {
        text-align: center;
        padding: 60px;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e5e7eb;
        border-top-color: #0a66c2;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Bulk Actions Bar */
      .bulk-actions-bar {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #1a202c;
        color: white;
        padding: 16px 24px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        gap: 16px;
        transition: transform 0.3s;
        z-index: 1000;
      }

      .bulk-actions-bar.visible {
        transform: translateX(-50%) translateY(0);
      }

      .bulk-actions-info {
        font-size: 14px;
        font-weight: 600;
      }

      .bulk-actions-buttons {
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <div class="header-top">
          <h1>📚 Saved Content Manager</h1>
          <div class="header-actions">
            <button class="btn btn-secondary" id="exportBtn">📥 Export</button>
            <button class="btn btn-primary" id="syncBtn">
              🔄 Sync from LinkedIn
            </button>
          </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
          <div class="stat-card" data-category="all">
            <div class="stat-number" id="statTotal">0</div>
            <div class="stat-label">Total Items</div>
          </div>
          <div class="stat-card" data-category="posts">
            <div class="stat-number" id="statPosts">0</div>
            <div class="stat-label">📝 Posts</div>
          </div>
          <div class="stat-card" data-category="links">
            <div class="stat-number" id="statLinks">0</div>
            <div class="stat-label">🔗 Links</div>
          </div>
          <div class="stat-card" data-category="visuals">
            <div class="stat-number" id="statVisuals">0</div>
            <div class="stat-label">🖼️ Visuals</div>
          </div>
          <div class="stat-card" data-category="videos">
            <div class="stat-number" id="statVideos">0</div>
            <div class="stat-label">🎥 Videos</div>
          </div>
        </div>

        <!-- Search & Controls -->
        <div class="controls">
          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              placeholder="Search saved items..."
            />
          </div>
          <select class="sort-select" id="sortSelect">
            <option value="newest">📅 Newest First</option>
            <option value="oldest">📅 Oldest First</option>
            <option value="type">📋 By Type</option>
          </select>
        </div>
      </div>

      <!-- Category Tabs -->
      <div class="category-tabs">
        <div class="category-tab active" data-category="all">
          <span>All Items</span>
          <span class="category-count" id="countAll">0</span>
        </div>
        <div class="category-tab" data-category="posts">
          <span>📝 Posts</span>
          <span class="category-count" id="countPosts">0</span>
        </div>
        <div class="category-tab" data-category="links">
          <span>🔗 Links</span>
          <span class="category-count" id="countLinks">0</span>
        </div>
        <div class="category-tab" data-category="visuals">
          <span>🖼️ Visuals</span>
          <span class="category-count" id="countVisuals">0</span>
        </div>
        <div class="category-tab" data-category="videos">
          <span>🎥 Videos</span>
          <span class="category-count" id="countVideos">0</span>
        </div>
      </div>

      <!-- Content Grid -->
      <div id="contentContainer">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading saved items...</p>
        </div>
      </div>
    </div>

    <!-- Bulk Actions Bar -->
    <div class="bulk-actions-bar" id="bulkActionsBar">
      <div class="bulk-actions-info">
        <span id="selectedCount">0</span> items selected
      </div>
      <div class="bulk-actions-buttons">
        <button class="btn btn-secondary" id="deselectAllBtn">
          Deselect All
        </button>
        <button class="btn btn-primary" id="deleteSelectedBtn">
          🗑️ Delete Selected
        </button>
      </div>
    </div>

    <script src="../content/saved-content-storage.js"></script>
    <script src="saved-items.js"></script>
  </body>
</html>
